name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a run still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Puppeteer's bundled Chrome is only needed by `pnpm generate`, a local
      # headless render, so skip the ~150 MB download.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      # The kernels are committed as public/wasm/kernels.wasm, so Zig is not
      # needed here. A project site is served from /<repo>/, which is the base
      # actions/configure-pages reports; vite.config.ts normalises it.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
